<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Torneos ARBA Arica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f1f5f9;--surface:#fff;--card:#fff;--border:#e2e8f0;--border2:#cbd5e1;
  --primary:#1e3a8a;--primary-h:#1e40af;--primary-light:#eff6ff;
  --orange:#f97316;--orange-light:#fff7ed;
  --red:#dc2626;--red-light:#fef2f2;
  --green:#16a34a;--green-light:#f0fdf4;
  --text:#1e293b;--muted:#64748b;--muted2:#94a3b8;
  --r:12px;--r-lg:18px;
}
html,body{background:var(--bg);color:var(--text);font-family:'Archivo',sans-serif;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:0;height:0}
#app-header{position:sticky;top:0;z-index:100;background:var(--primary);padding:0 16px;height:58px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(30,58,138,.3)}
.logo-wordmark{line-height:1}
.logo-arba{font-family:'Archivo Black',sans-serif;font-size:22px;letter-spacing:2px;color:#fff}
.logo-sub{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.5);margin-top:1px}
#admin-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.8);transition:all .2s}
#admin-btn svg{width:18px;height:18px}
#main-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -2px 12px rgba(0,0,0,.06);padding-bottom:env(safe-area-inset-bottom)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 7px;cursor:pointer;color:var(--muted2);transition:color .2s;border:none;background:none;font-size:9px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.nav-item.active{color:var(--primary)}
.nav-item svg{width:20px;height:20px;flex-shrink:0}
.nav-dot{width:4px;height:4px;border-radius:50%;background:var(--primary);margin-top:1px;opacity:0;transition:opacity .2s}
.nav-item.active .nav-dot{opacity:1}
#content{padding:16px 16px 90px}
.section{display:none}
.section.active{display:block;animation:fadeUp .2s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-title{font-family:'Archivo Black',sans-serif;font-size:22px;letter-spacing:-.5px}
.sec-title span{color:var(--orange)}
.sec-badge{font-size:11px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:4px 10px;border-radius:100px}
.accordion-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.accordion-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;background:var(--card);transition:background .15s}
.accordion-header:hover{background:#fafbff}
.accordion-header-left{display:flex;flex-direction:column;gap:3px}
.accordion-liga-name{font-family:'Archivo Black',sans-serif;font-size:15px;letter-spacing:-.3px}
.accordion-meta{display:flex;align-items:center;gap:6px}
.accordion-deporte{font-size:11px;color:var(--muted);font-weight:600}
.acc-estado{font-size:10px;font-weight:700;padding:2px 8px;border-radius:100px;letter-spacing:.5px;text-transform:uppercase}
.estado-activo{background:var(--green-light);color:var(--green);border:1px solid #bbf7d0}
.estado-finalizado{background:var(--primary-light);color:var(--primary);border:1px solid #bfdbfe}
.accordion-chevron{transition:transform .25s;color:var(--muted2);flex-shrink:0}
.accordion-chevron svg{width:18px;height:18px}
.accordion-chevron.open{transform:rotate(180deg)}
.accordion-body{display:none;border-top:1px solid var(--border);padding:16px}
.accordion-body.open{display:block}
.standings-sub-title{font-family:'Archivo Black',sans-serif;font-size:14px;letter-spacing:-.3px;margin-bottom:10px;color:var(--primary)}
.st-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;font-size:12px}
.st-table th{background:#f8fafc;color:var(--muted2);font-size:10px;font-weight:700;padding:8px 6px;text-align:center;letter-spacing:.8px;text-transform:uppercase;border-bottom:1px solid var(--border)}
.st-table th:nth-child(2){text-align:left;padding-left:10px}
.st-table td{padding:10px 6px;text-align:center;border-bottom:1px solid #f1f5f9;color:var(--muted);font-weight:500}
.st-table tr:last-child td{border-bottom:none}
.st-table tr:hover td{background:#fafbff}
.st-table td:nth-child(2){text-align:left;padding-left:10px;font-weight:700;font-size:13px;color:var(--text)}
.rk{font-family:'Archivo Black',sans-serif;font-size:14px}
.rk.g{color:var(--orange)}.rk.s{color:#94a3b8}.rk.b{color:#b45309}
.pts-cell{font-family:'Archivo Black',sans-serif;font-size:15px;color:var(--primary)}
.dif-pos{color:var(--green)}.dif-neg{color:var(--red)}
.day-group{margin-bottom:18px}
.day-label{font-family:'Archivo Black',sans-serif;font-size:11px;color:var(--primary);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.day-label::after{content:'';flex:1;height:1px;background:var(--border)}
.match-card{background:#fafbff;border:1px solid var(--border);border-left:3px solid var(--border2);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .2s}
.match-card.live{border-left-color:var(--red)}
.match-card.final{border-left-color:var(--primary)}
.match-card.prog{border-left-color:var(--green)}
.match-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.match-liga-tag{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
.match-status{font-size:10px;font-weight:700;letter-spacing:.8px;padding:2px 8px;border-radius:100px;text-transform:uppercase}
.status-live{background:var(--red-light);color:var(--red);border:1px solid #fecaca}
.status-final{background:var(--primary-light);color:var(--primary);border:1px solid #bfdbfe}
.status-prog{background:var(--green-light);color:var(--green);border:1px solid #bbf7d0}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--orange);display:inline-block;margin-right:4px;animation:pulse 1.2s infinite}
.status-cuarto{background:var(--orange-light);color:var(--orange);border:1px solid #fed7aa}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.results-divider{font-size:11px;font-weight:700;color:var(--muted2);letter-spacing:.8px;text-transform:uppercase;margin:16px 0 10px;display:flex;align-items:center;gap:8px}
.results-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.match-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.team-side{display:flex;flex-direction:column;gap:4px}
.team-side.right{text-align:right;align-items:flex-end}
.team-color{width:20px;height:3px;border-radius:2px;background:var(--border2)}
.team-name{font-family:'Archivo Black',sans-serif;font-size:14px;letter-spacing:-.3px;line-height:1.2;color:var(--text)}
.team-name.winner{color:var(--primary)}
.score-block{text-align:center}
.score-nums{font-family:'Archivo Black',sans-serif;font-size:30px;letter-spacing:-2px;line-height:1;display:flex;align-items:center;gap:3px;justify-content:center}
.score-n{color:var(--text)}.score-n.live{color:var(--red)}.score-n.winner{color:var(--primary)}
.score-sep{color:var(--muted2);font-size:18px;font-family:'Archivo Black',sans-serif}
.score-vs{font-size:11px;font-weight:700;color:var(--muted2);letter-spacing:2px}
.match-footer{margin-top:10px;padding-top:8px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.match-info{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.match-info svg{width:11px;height:11px}
.yt-link{font-size:10px;font-weight:700;color:var(--red);text-decoration:none;display:flex;align-items:center;gap:3px}
.match-expand{display:none;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.match-expand.open{display:block}
.exp-row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;color:var(--muted)}
.exp-row span:last-child{color:var(--text);font-weight:600}
.chevron{transition:transform .25s;color:var(--muted2);cursor:pointer}
.chevron.open{transform:rotate(180deg)}
.chevron svg{width:14px;height:14px}
.day-block{margin-bottom:16px}
.day-block-header{background:var(--primary);color:#fff;padding:10px 16px;border-radius:var(--r) var(--r) 0 0;display:flex;align-items:center;justify-content:space-between}
.day-block-title{font-family:'Archivo Black',sans-serif;font-size:14px;letter-spacing:-.3px}
.day-block-count{font-size:11px;opacity:.7}
.sched-card{background:var(--card);border:1px solid var(--border);border-top:none;padding:14px 16px;width:100%}
.sched-card:last-child{border-radius:0 0 var(--r) var(--r)}
.sched-card+.sched-card{border-top:1px solid var(--border)}
.sched-card.proximo{border-left:3px solid var(--orange)}
.sched-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sched-num{font-size:11px;font-weight:700;color:var(--primary);background:var(--primary-light);padding:2px 8px;border-radius:100px;border:1px solid #bfdbfe}
.sched-num.proximo-badge{background:var(--orange-light);color:var(--orange);border-color:#fed7aa}
.sched-badges{display:flex;align-items:center;gap:5px}
.sched-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:12px}
.sched-team-name{font-family:'Archivo Black',sans-serif;font-size:15px;letter-spacing:-.3px;color:var(--text);line-height:1.2}
.sched-team-name.right{text-align:right}
.sched-vs{font-family:'Archivo Black',sans-serif;font-size:16px;color:var(--primary);background:var(--primary-light);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid #bfdbfe}
.sched-hora{font-family:'Archivo Black',sans-serif;font-size:22px;color:var(--primary);text-align:center;line-height:1}
.sched-hora-sub{font-size:10px;color:var(--muted);text-align:center;margin-top:1px}
.sched-bottom{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--border);gap:6px;min-width:0}
.sched-share-btn{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--primary);background:var(--primary-light);border:1px solid #bfdbfe;padding:4px 10px;border-radius:100px;cursor:pointer}
.share-modal-overlay{position:fixed;inset:0;z-index:300;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.share-modal-overlay.open{display:flex}
.share-modal{background:var(--surface);border-radius:22px 22px 0 0;width:100%;max-width:640px;padding:8px 0 env(safe-area-inset-bottom);animation:slideUp .3s cubic-bezier(.32,1,.4,1)}
.share-modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:10px auto 16px}
.share-modal-title{font-family:'Archivo Black',sans-serif;font-size:13px;color:var(--muted2);letter-spacing:.5px;text-transform:uppercase;text-align:center;margin-bottom:14px}
.share-card-preview{background:#1e3a8a;border-radius:14px;margin:0 16px 16px;overflow:hidden}
.share-card-top{padding:16px 18px 12px;text-align:center}
.share-card-logo{font-size:11px;font-weight:700;letter-spacing:3px;color:rgba(255,255,255,.45);text-transform:uppercase;margin-bottom:12px}
.share-card-logo span{color:#f97316}
.share-card-badge{display:inline-block;background:rgba(255,255,255,.12);color:#fff;font-size:10px;font-weight:700;padding:3px 10px;border-radius:100px;letter-spacing:.8px;text-transform:uppercase;margin-bottom:12px}
.share-card-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:4px}
.share-card-tname{color:#fff;font-family:'Archivo Black',sans-serif;font-size:16px;letter-spacing:-.3px;text-align:center;line-height:1.2}
.share-card-tcat{font-size:9px;color:rgba(255,255,255,.45);text-align:center;margin-top:3px}
.share-card-vs{background:rgba(255,255,255,.12);color:#fff;font-family:'Archivo Black',sans-serif;font-size:12px;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin:0 auto}
.share-card-divider{height:1px;background:rgba(255,255,255,.12);margin:12px 0}
.share-card-info{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center;padding-bottom:2px}
.share-card-info-icon{font-size:16px;margin-bottom:3px}
.share-card-info-val{color:#fff;font-size:12px;font-weight:700;line-height:1.2}
.share-card-info-sub{color:rgba(255,255,255,.45);font-size:9px;margin-top:1px}
.share-card-footer{background:rgba(0,0,0,.2);padding:8px 18px;display:flex;justify-content:space-between;align-items:center}
.share-card-footer-liga{color:rgba(255,255,255,.55);font-size:11px}
.share-card-footer-url{color:rgba(255,255,255,.35);font-size:10px}
.share-actions{display:flex;gap:10px;padding:0 16px 16px}
.share-btn-wa{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:13px;border-radius:12px;background:#25D366;color:#fff;font-family:'Archivo',sans-serif;font-weight:700;font-size:13px;text-decoration:none;border:none;cursor:pointer}
.share-btn-copy{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:13px;border-radius:12px;background:var(--bg);color:var(--text);font-family:'Archivo',sans-serif;font-weight:700;font-size:13px;border:1.5px solid var(--border);cursor:pointer}
.share-btn-wa svg,.share-btn-copy svg{width:16px;height:16px;flex-shrink:0}
.share-close{width:100%;padding:12px;background:none;border:none;color:var(--muted);font-family:'Archivo',sans-serif;font-weight:700;font-size:13px;cursor:pointer;margin-bottom:4px}
.sched-share-btn{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--primary);background:var(--primary-light);border:1px solid #bfdbfe;padding:4px 10px;border-radius:100px;cursor:pointer;border-width:1px}
.sched-lugar{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.sched-lugar svg{width:11px;height:11px;flex-shrink:0}
.sched-liga{font-size:11px;color:var(--muted)}
.cat-v{background:var(--primary-light);color:var(--primary);border:1px solid #bfdbfe;font-size:10px;font-weight:700;padding:2px 8px;border-radius:100px;text-transform:uppercase}
.cat-d{background:#fdf4ff;color:#9333ea;border:1px solid #e9d5ff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:100px;text-transform:uppercase}
.cat-m{background:var(--green-light);color:var(--green);border:1px solid #bbf7d0;font-size:10px;font-weight:700;padding:2px 8px;border-radius:100px;text-transform:uppercase}
.proximo-dot{width:7px;height:7px;border-radius:50%;background:var(--orange);display:inline-block;margin-right:4px}
.news-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.news-item-header{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;cursor:pointer;gap:10px}
.news-item-header:active{background:var(--bg)}
.news-item-left{flex:1;min-width:0}
.news-item-date{font-size:10px;font-weight:700;color:var(--orange);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.news-item-title{font-family:'Archivo Black',sans-serif;font-size:14px;letter-spacing:-.3px;color:var(--text);line-height:1.3}
.news-item-chevron{color:var(--muted2);transition:transform .25s;flex-shrink:0}
.news-item-chevron svg{width:16px;height:16px}
.news-item-chevron.open{transform:rotate(180deg)}
.news-item-body{display:none;padding:0 14px 14px;border-top:1px solid var(--border)}
.news-item-body.open{display:block}
.news-item-text{font-size:13px;color:var(--muted);line-height:1.7;padding-top:12px}
.news-item-actions{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.news-wa-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:100px;background:#25D366;color:#fff;font-size:12px;font-weight:700;text-decoration:none}
.news-wa-btn svg{width:14px;height:14px}
.news-date{font-size:11px;font-weight:700;color:var(--orange);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
.news-title{font-family:'Archivo Black',sans-serif;font-size:18px;letter-spacing:-.5px;line-height:1.25;margin-bottom:8px}
.news-desc{font-size:13px;color:var(--muted);line-height:1.6}
.news-link{display:inline-flex;align-items:center;gap:4px;margin-top:10px;font-size:12px;font-weight:700;color:var(--primary);text-decoration:none}

.sanction-card{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--red);border-radius:0 var(--r) var(--r) 0;padding:12px 14px;margin-bottom:10px}
.sanc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sanc-type{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--red);background:var(--red-light);padding:2px 8px;border-radius:100px;border:1px solid #fecaca}
.sanc-player{font-family:'Archivo Black',sans-serif;font-size:15px;letter-spacing:-.3px;margin-bottom:4px}
.sanc-detail{font-size:12px;color:var(--muted);line-height:1.5}
.sanc-end{font-size:11px;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:4px;font-weight:600}
.sanc-end svg{width:11px;height:11px}
.empty{text-align:center;padding:40px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty-icon{font-size:32px;opacity:.2}
.empty-text{font-size:13px;color:var(--muted2);font-weight:600}
.skel{background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%);background-size:200% 100%;animation:sh 1.4s infinite;border-radius:var(--r)}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
#admin-overlay{position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.6);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
#admin-overlay.open{display:flex}
#admin-panel{background:var(--surface);border:1px solid var(--border);border-radius:22px 22px 0 0;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom);animation:slideUp .3s cubic-bezier(.32,1,.4,1);box-shadow:0 -8px 32px rgba(0,0,0,.12)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
@media(min-width:640px){
  #admin-overlay{align-items:center;justify-content:center;padding:20px}
  #admin-panel{border-radius:20px;max-height:88vh;width:100%;max-width:720px;animation:fadeIn .25s ease}
  .panel-handle{display:none}
  .adm-tabs{flex-wrap:wrap;gap:8px;padding:16px 24px 0}
  .adm-tab{padding:8px 16px;font-size:12px}
  .adm-panel{padding:20px 24px 0}
  .panel-header{padding:20px 24px}
  #login-form{padding:28px 24px}
  .f-row{grid-template-columns:1fr 1fr}
}

@media(min-width:640px){
  #admin-overlay{align-items:center;justify-content:center;padding:20px}
  #admin-panel{border-radius:20px;max-height:88vh;width:100%;max-width:680px;animation:fadeIn .25s ease}
  .panel-handle{display:none}
}
.panel-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto}
.panel-header{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.panel-logo-mark{font-family:'Archivo Black',sans-serif;font-size:18px;letter-spacing:1.5px;color:var(--primary)}
.panel-logo-mark span{color:var(--orange)}
.panel-sub{font-size:10px;font-weight:700;color:var(--muted2);letter-spacing:.5px;text-transform:uppercase;margin-top:1px}
.panel-close{width:30px;height:30px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.panel-close svg{width:14px;height:14px}
#login-form{padding:24px 18px}
.f-label{font-size:10px;font-weight:700;color:var(--muted2);letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px;display:block}
.f-input,.f-select{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;color:var(--text);padding:11px 14px;font-family:'Archivo',sans-serif;font-size:15px;outline:none;transition:border-color .2s;margin-bottom:14px;-webkit-appearance:none}
.f-input:focus,.f-select:focus{border-color:var(--primary)}
.f-select option{background:var(--surface)}
textarea.f-input{resize:none}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.login-error{font-size:13px;color:var(--red);margin-bottom:12px;display:none;font-weight:600}
.btn-primary{width:100%;padding:13px;border-radius:10px;background:var(--primary);color:#fff;font-family:'Archivo',sans-serif;font-weight:700;font-size:14px;cursor:pointer;border:none;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary:active{background:var(--primary-h)}
.btn-orange{width:100%;padding:13px;border-radius:10px;background:var(--orange);color:#fff;font-family:'Archivo',sans-serif;font-weight:700;font-size:14px;cursor:pointer;border:none;margin-bottom:0}
.btn-ghost{width:100%;padding:12px;border-radius:10px;background:transparent;color:var(--muted);border:1.5px solid var(--border);font-family:'Archivo',sans-serif;font-weight:700;font-size:14px;cursor:pointer}
#admin-content{display:none}
.adm-tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 18px 0;scrollbar-width:none;flex-wrap:wrap}
.adm-tabs::-webkit-scrollbar{display:none}
.adm-tab{flex-shrink:0;padding:7px 13px;border-radius:8px;background:var(--bg);border:1.5px solid var(--border);color:var(--muted2);font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.adm-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.adm-panel{display:none;padding:16px 18px 0}
.adm-panel.active{display:block}
@media(min-width:640px){
  .adm-tabs{flex-wrap:wrap;gap:8px;padding:16px 24px 0}
  .adm-tab{padding:8px 16px;font-size:12px}
  .adm-panel{padding:20px 24px 0}
  .panel-header{padding:20px 24px}
  #login-form{padding:28px 24px}
}
.adm-sec-label{font-size:10px;font-weight:700;color:var(--muted2);letter-spacing:.6px;text-transform:uppercase;margin:16px 0 10px}
.adm-list-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.adm-list-name{font-size:13px;font-weight:700;color:var(--text)}
.adm-list-sub{font-size:11px;color:var(--muted2);margin-top:2px;display:flex;align-items:center;gap:5px}
.del-btn{padding:5px 10px;background:var(--red-light);border:1px solid #fecaca;border-radius:7px;color:var(--red);font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0}
.edit-btn{padding:5px 10px;background:var(--primary-light);border:1px solid #bfdbfe;border-radius:7px;color:var(--primary);font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;margin-right:6px}
.result-row{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 13px;margin-bottom:10px}
.result-label{font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:500;line-height:1.5}
.result-label strong{color:var(--text);font-weight:700}
.result-inputs{display:flex;align-items:center;gap:6px}
.score-in{width:54px;padding:9px 4px;text-align:center;background:var(--surface);border:1.5px solid var(--border);border-radius:9px;color:var(--text);font-family:'Archivo Black',sans-serif;font-size:22px;outline:none;transition:border-color .2s;-moz-appearance:textfield}
.score-in:focus{border-color:var(--primary)}
.score-in::-webkit-inner-spin-button,.score-in::-webkit-outer-spin-button{-webkit-appearance:none}
.score-dash{font-family:'Archivo Black',sans-serif;font-size:18px;color:var(--border2);width:16px;text-align:center;flex-shrink:0}
.st-sel{flex:1;background:var(--surface);border:1.5px solid var(--border);border-radius:9px;color:var(--text);padding:9px 8px;font-family:'Archivo',sans-serif;font-size:12px;font-weight:600;outline:none;-webkit-appearance:none;transition:border-color .2s}
.st-sel:focus{border-color:var(--primary)}
.save-btn{padding:9px 13px;background:var(--primary);color:#fff;border:none;border-radius:9px;font-weight:700;font-size:12px;cursor:pointer;flex-shrink:0}
.badge-v{background:var(--primary-light);color:var(--primary);font-size:10px;font-weight:700;padding:2px 8px;border-radius:100px;border:1px solid #bfdbfe}
.badge-d{background:#fdf4ff;color:#9333ea;font-size:10px;font-weight:700;padding:2px 8px;border-radius:100px;border:1px solid #e9d5ff}
.badge-m{background:var(--green-light);color:var(--green);font-size:10px;font-weight:700;padding:2px 8px;border-radius:100px;border:1px solid #bbf7d0}
#modal-overlay{position:fixed;inset:0;z-index:300;background:rgba(15,23,42,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
#modal-overlay.open{display:flex}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;padding:24px}
.modal-title{font-family:'Archivo Black',sans-serif;font-size:18px;letter-spacing:-.5px;margin-bottom:18px;color:var(--primary)}
.modal-actions{display:flex;gap:8px;margin-top:16px}
#confirm-overlay{position:fixed;inset:0;z-index:400;background:rgba(15,23,42,.7);display:none;align-items:center;justify-content:center;padding:20px}
#confirm-overlay.open{display:flex}
.confirm-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:360px;padding:24px;text-align:center}
.confirm-msg{font-size:14px;color:var(--text);line-height:1.6;margin-bottom:20px}
.confirm-actions{display:flex;gap:8px}
.confirm-actions button{flex:1;padding:12px;border-radius:10px;font-family:'Archivo',sans-serif;font-weight:700;font-size:14px;cursor:pointer;border:none}
.conf-ok{background:var(--primary);color:#fff}
.conf-cancel{background:var(--bg);color:var(--muted);border:1.5px solid var(--border)!important}
#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--text);color:#fff;padding:10px 20px;border-radius:100px;font-size:13px;font-weight:700;opacity:0;transition:all .3s;z-index:500;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:var(--green)}
#toast.err{background:var(--red)}
</style>
</head>
<body>

<!-- PANTALLA BIENVENIDA -->
<div id="splash-screen" style="position:fixed;inset:0;z-index:999;background:#0f1f4a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow:hidden">
  <div style="position:absolute;width:500px;height:500px;border-radius:50%;background:rgba(255,255,255,.05);top:-100px;right:-100px"></div>
  <div style="position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(249,115,22,.06);bottom:-50px;left:-80px"></div>
  <div style="position:relative;z-index:1;text-align:center;max-width:360px;width:100%">
    <div style="margin-bottom:24px;animation:float 3s ease-in-out infinite">
      <svg width="90" height="90" viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="46" fill="#f97316" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
        <path d="M50 4 C50 4 50 96 50 96" stroke="rgba(0,0,0,0.25)" stroke-width="2.5" fill="none"/>
        <path d="M4 50 C4 50 96 50 96 50" stroke="rgba(0,0,0,0.25)" stroke-width="2.5" fill="none"/>
        <path d="M15 20 C30 35 35 65 25 80" stroke="rgba(0,0,0,0.2)" stroke-width="2" fill="none"/>
        <path d="M85 20 C70 35 65 65 75 80" stroke="rgba(0,0,0,0.2)" stroke-width="2" fill="none"/>
        <ellipse cx="35" cy="30" rx="10" ry="6" fill="rgba(255,255,255,0.15)" transform="rotate(-30 35 30)"/>
      </svg>
    </div>
    <div style="font-size:12px;font-weight:700;letter-spacing:4px;color:rgba(255,255,255,.4);text-transform:uppercase;margin-bottom:4px">Arica · Chile</div>
    <div style="font-family:'Archivo Black',sans-serif;font-size:52px;letter-spacing:4px;color:#fff;line-height:1;margin-bottom:4px">ARBA</div>
    <div style="font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#f97316;margin-bottom:36px">Competencias</div>
    <div style="width:48px;height:3px;background:#f97316;border-radius:2px;margin:0 auto 32px"></div>
    <button onclick="enterApp()" style="width:100%;padding:15px;border-radius:14px;background:#f97316;color:#fff;font-family:'Archivo Black',sans-serif;font-size:16px;letter-spacing:1px;border:none;cursor:pointer;box-shadow:0 8px 24px rgba(249,115,22,.35);margin-bottom:16px">INGRESAR →</button>
    <a href="https://www.instagram.com/arba.arica" target="_blank" style="display:inline-flex;align-items:center;gap:8px;color:rgba(255,255,255,.5);font-size:13px;font-weight:600;text-decoration:none;padding:10px 18px;border-radius:100px;border:1px solid rgba(255,255,255,.15);margin-bottom:32px">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      @arba.arica
    </a>
    <div style="font-size:10px;color:rgba(255,255,255,.2);letter-spacing:.5px">arba.arica@gmail.com</div>
  </div>
</div>

<header id="app-header">
  <div class="logo-wordmark">
    <div class="logo-arba">ARBA</div>
    <div class="logo-sub">Competencias</div>
  </div>
  <button id="admin-btn">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path stroke-linecap="round" stroke-linejoin="round" d="M6 20v-2a6 6 0 0112 0v2"/></svg>
  </button>
</header>

<div id="content">
  <div id="sec-noticias" class="section active">
    <div class="sec-header"><div class="sec-title">Noticias<span>.</span></div></div>
    <div id="noticias-list"></div>
  </div>
  <div id="sec-agenda" class="section">
    <div class="sec-header"><div class="sec-title">Programación<span>.</span></div><div class="sec-badge" id="badge-ag">—</div></div>
    <div id="agenda-list"><div class="skel" style="height:76px;margin-bottom:10px"></div><div class="skel" style="height:76px"></div></div>
  </div>
  <div id="sec-posiciones" class="section">
    <div class="sec-header"><div class="sec-title">Tabla de Puntaje<span>.</span></div><div class="sec-badge" id="badge-pos">—</div></div>
    <div id="posiciones-list"><div class="skel" style="height:56px;margin-bottom:10px"></div><div class="skel" style="height:56px"></div></div>
  </div>
  <div id="sec-resultados" class="section">
    <div class="sec-header"><div class="sec-title">Resultados<span>.</span></div><div class="sec-badge" id="badge-res">—</div></div>
    <div id="resultados-list"><div class="skel" style="height:100px;margin-bottom:10px"></div><div class="skel" style="height:100px"></div></div>
  </div>
  <div id="sec-sanciones" class="section">
    <div class="sec-header"><div class="sec-title">Sanciones<span>.</span></div></div>
    <div id="sanciones-list"></div>
  </div>
</div>

<nav id="main-nav">
  <button class="nav-item active" data-sec="noticias">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10l6 6v8a2 2 0 01-2 2z"/><path d="M14 4v6h6M12 11v6M9 14h6"/></svg>
    Noticias<div class="nav-dot"></div>
  </button>
  <button class="nav-item" data-sec="agenda">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    Fixture<div class="nav-dot"></div>
  </button>
  <button class="nav-item" data-sec="posiciones">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
    Puntaje<div class="nav-dot"></div>
  </button>
  <button class="nav-item" data-sec="resultados">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
    Resultados<div class="nav-dot"></div>
  </button>
  <button class="nav-item" data-sec="sanciones">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
    Sanciones<div class="nav-dot"></div>
  </button>
</nav>

<!-- ADMIN PANEL -->
<div id="admin-overlay">
  <div id="admin-panel">
    <div class="panel-handle"></div>
    <div class="panel-header">
      <div><div class="panel-logo-mark">ARBA<span>.</span></div><div class="panel-sub">Administración</div></div>
      <button class="panel-close" id="panel-close-btn"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div id="login-form">
      <label class="f-label">Contraseña</label>
      <input class="f-input" type="password" id="admin-pass" placeholder="••••••••" autocomplete="current-password">
      <div class="login-error" id="login-error">Contraseña incorrecta</div>
      <button class="btn-primary" id="do-login">Ingresar</button>
    </div>
    <div id="admin-content">
      <div class="adm-tabs">
        <button class="adm-tab active" data-tab="tab-ligas">Ligas</button>
        <button class="adm-tab" data-tab="tab-equipos">Equipos</button>
        <button class="adm-tab" data-tab="tab-partidos">Partidos</button>
        <button class="adm-tab" data-tab="tab-res-adm">Resultados</button>
        <button class="adm-tab" data-tab="tab-noticias-adm">Noticias</button>
        <button class="adm-tab" data-tab="tab-sanciones-adm">Sanciones</button>
      </div>
      <div class="adm-panel active" id="tab-ligas">
        <label class="f-label">Categoría</label>
        <select class="f-select" id="lg-cat"><option>Varones</option><option>Damas</option><option>Mixto</option></select>
        <label class="f-label">Nombre de la liga</label>
        <input class="f-input" id="lg-nombre" type="text" placeholder="Ej: Torneo Apertura 2025">
        <label class="f-label">Estado</label>
        <select class="f-select" id="lg-estado"><option value="Activo">Activo</option><option value="Finalizado">Finalizado</option></select>
        <button class="btn-primary" id="btn-liga" style="margin-bottom:16px">+ Crear Liga</button>
        <div class="adm-sec-label">Ligas registradas</div>
        <div id="ligas-adm-list"></div>
      </div>
      <div class="adm-panel" id="tab-equipos">
        <label class="f-label">Liga</label>
        <select class="f-select" id="eq-liga"></select>
        <label class="f-label">Nombre del equipo</label>
        <input class="f-input" id="eq-nombre" type="text" placeholder="Ej: Los Pumas">
        <div class="f-row">
          <div><label class="f-label">Color local</label><input class="f-input" id="eq-cl" type="text" placeholder="Rojo"></div>
          <div><label class="f-label">Color visita</label><input class="f-input" id="eq-cv" type="text" placeholder="Blanco"></div>
        </div>
        <button class="btn-primary" id="btn-equipo" style="margin-bottom:16px">+ Agregar Equipo</button>
        <div class="adm-sec-label">Equipos registrados</div>
        <div id="equipos-adm-list"></div>
      </div>
      <div class="adm-panel" id="tab-partidos">
        <label class="f-label">Liga</label>
        <select class="f-select" id="pt-liga"></select>
        <div class="f-row">
          <div><label class="f-label">N° Partido</label><input class="f-input" id="pt-jornada" type="number" placeholder="1" min="1"></div>
          <div><label class="f-label">Fase</label>
            <select class="f-select" id="pt-fase" style="margin-bottom:0">
              <option>Regular</option><option>Grupo A</option><option>Grupo B</option><option>Semifinales</option><option>Tercer Lugar</option><option>Final</option>
            </select>
          </div>
        </div>
        <div class="f-row">
          <div><label class="f-label">Fecha</label><input class="f-input" id="pt-fecha" type="date"></div>
          <div><label class="f-label">Hora</label><input class="f-input" id="pt-hora" type="time"></div>
        </div>
        <label class="f-label">Cancha / Lugar</label>
        <input class="f-input" id="pt-cancha" type="text" placeholder="Ej: Gimnasio Municipal">
        <label class="f-label">Equipo Local</label>
        <select class="f-select" id="pt-local"></select>
        <label class="f-label">Equipo Visitante</label>
        <select class="f-select" id="pt-visita"></select>
        <label class="f-label">URL YouTube (opcional)</label>
        <input class="f-input" id="pt-yt" type="url" placeholder="https://youtube.com/...">
        <button class="btn-primary" id="btn-partido" style="margin-bottom:16px">📅 Programar Partido</button>
        <div class="adm-sec-label">Partidos registrados</div>
        <div id="partidos-adm-list"></div>
      </div>
      <div class="adm-panel" id="tab-res-adm"><div id="res-adm-list"></div></div>
      <div class="adm-panel" id="tab-noticias-adm">
        <label class="f-label">Título</label>
        <input class="f-input" id="nt-titulo" type="text" placeholder="Título de la noticia">
        <label class="f-label">Contenido</label>
        <textarea class="f-input" id="nt-desc" rows="4" placeholder="Cuerpo de la noticia"></textarea>
        <div style="margin-bottom:14px">
          <button type="button" onclick="toggleNtExtra()" style="font-size:11px;font-weight:700;color:var(--muted);background:none;border:none;cursor:pointer;padding:0;text-decoration:underline">+ Opciones adicionales (URL imagen / enlace)</button>
          <div id="nt-extra" style="display:none;margin-top:10px">
            <label class="f-label">URL imagen (opcional)</label>
            <input class="f-input" id="nt-img" type="url" placeholder="https://...">
            <label class="f-label">URL enlace (opcional)</label>
            <input class="f-input" id="nt-link" type="url" placeholder="https://...">
          </div>
        </div>
        <button class="btn-orange" id="btn-noticia" style="margin-bottom:16px">📰 Publicar Noticia</button>
        <div class="adm-sec-label">Publicadas</div>
        <div id="noticias-adm-list"></div>
      </div>
      <div class="adm-panel" id="tab-sanciones-adm">
        <label class="f-label">Liga</label>
        <select class="f-select" id="sa-liga"></select>
        <label class="f-label">Equipo</label>
        <select class="f-select" id="sa-equipo"></select>
        <label class="f-label">Nombre del jugador</label>
        <input class="f-input" id="sa-jugador" type="text" placeholder="Apellido, Nombre">
        <label class="f-label">Tipo de falta</label>
        <select class="f-select" id="sa-tipo">
          <option>Falta Técnica</option><option>Falta Antideportiva</option><option>Expulsión</option><option>Agresión</option><option>Otros</option>
        </select>
        <label class="f-label">Detalle de sanción</label>
        <textarea class="f-input" id="sa-sancion" rows="2" placeholder="Ej: 2 partidos de suspensión"></textarea>
        <label class="f-label">Término de sanción</label>
        <input class="f-input" id="sa-termino" type="text" placeholder="Ej: Jornada 6 / 20-05-2025">
        <div style="background:var(--orange-light);border:1.5px solid #fed7aa;border-radius:10px;padding:12px;margin-bottom:14px">
          <label class="f-label" style="color:var(--orange)">⚖️ Apelación (opcional)</label>
          <input class="f-input" id="sa-apelacion" type="text" placeholder="Ej: Plazo hasta 26 de abril de 2026" style="margin-bottom:0;background:#fff;border-color:#fed7aa">
        </div>
        <button class="btn-orange" id="btn-sancion" style="margin-bottom:16px">⚠️ Registrar Sanción</button>
        <div class="adm-sec-label">Sanciones activas</div>
        <div id="sanciones-adm-list"></div>
      </div>
      <div style="padding:16px 18px 24px">
        <button class="btn-ghost" id="btn-logout">Cerrar sesión</button>
      </div>
    </div>
  </div>
</div>

<div id="modal-overlay">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">Editar</div>
    <div id="modal-body"></div>

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function ligaObj(id) { return D.ligas.find(l => l.ID === id); }
function teamName(id) { const t = D.equipos.find(e => e.ID === id); return t ? t.NombreEquipo : '?'; }
function teamColor(id, tipo) {
  const t = D.equipos.find(e => e.ID === id);
  if (!t) return '#cbd5e1';
  return tipo === 'local' ? (t.ColorUniformeLocal || '#cbd5e1') : (t.ColorUniformeVisita || '#cbd5e1');
}
function cleanFecha(raw) {
  if (!raw) return '';
  const s = String(raw).trim();
  // Formato DD/MM/YYYY HH:MM:SS (como llega de Sheets API a veces)
  const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if (dmy) return dmy[3] + '-' + dmy[2].padStart(2,'0') + '-' + dmy[1].padStart(2,'0');
  // Formato YYYY-MM-DD con o sin hora
  const ymd = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (ymd) return ymd[1] + '-' + ymd[2] + '-' + ymd[3];
  // Número serial de Excel/Sheets (días desde 1899-12-30)
  const num = parseFloat(s);
  if (!isNaN(num) && num > 1000) {
    const d = new Date((num - 25569) * 86400000);
    return d.toISOString().split('T')[0];
  }
  return s.split('T')[0];
}
function fmtDate(raw) {
  if (!raw) return '';
  const clean = cleanFecha(raw);
  if (!clean) return '';
  const d = new Date(clean + 'T12:00:00');
  if (isNaN(d)) return raw;
  return d.toLocaleDateString('es-CL', {
    weekday:'long', day:'numeric', month:'long', year:'numeric'
  });
}
function fmtTime(t) {
  if (!t) return '';
  const s = String(t).trim();
  // Si parece fecha (contiene / o - o T) ignorar
  if (s.includes('T') || s.match(/^\d{4}-/) || s.match(/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}/)) return '';
  // Extraer HH:MM
  const m = s.match(/(\d{1,2}):(\d{2})/);
  return m ? m[1].padStart(2,'0') + ':' + m[2] + ' hrs' : s;
}
function catClass(cat) { return cat==='Varones'?'cat-v':cat==='Damas'?'cat-d':'cat-m'; }
function empty(icon, txt) { return `<div class="empty"><div class="empty-icon">${icon}</div><div class="empty-text">${txt}</div></div>`; }

// ─── STANDINGS (calculado en cliente) ────────────────────────────────────────
function calcStandings(ligaId) {
  const liga = ligaObj(ligaId);
  if (!liga) return [];
  const equipos = D.equipos.filter(e => e.ID_Liga === ligaId);
  const partidos = D.partidos.filter(p => p.ID_Liga === ligaId && p.Estado === 'Finalizado');
  const standings = {};
  equipos.forEach(t => {
    standings[t.ID] = { ID:t.ID, NombreEquipo:t.NombreEquipo, PJ:0, PG:0, PE:0, PP:0, GF:0, GC:0, DG:0, Puntos:0 };
  });
  partidos.forEach(m => {
    const loc = standings[m.ID_EquipoLocal];
    const vis = standings[m.ID_EquipoVisita];
    if (!loc || !vis) return;
    const gl = parseInt(m.GolesLocal) || 0;
    const gv = parseInt(m.GolesVisita) || 0;
    loc.PJ++; vis.PJ++;
    loc.GF += gl; loc.GC += gv; loc.DG = loc.GF - loc.GC;
    vis.GF += gv; vis.GC += gl; vis.DG = vis.GF - vis.GC;
    const pV = parseInt(liga.PuntosVictoria) || 2;
    const pE = parseInt(liga.PuntosEmpate)   || 0;
    const pD = parseInt(liga.PuntosDerrota)  || 1;
    if      (gl > gv) { loc.PG++; loc.Puntos+=pV; vis.PP++; vis.Puntos+=pD; }
    else if (gl < gv) { vis.PG++; vis.Puntos+=pV; loc.PP++; loc.Puntos+=pD; }
    else              { loc.PE++; loc.Puntos+=pE; vis.PE++; vis.Puntos+=pE; }
  });
  return Object.values(standings).sort((a,b) =>
    b.Puntos - a.Puntos || b.DG - a.DG || b.GF - a.GF
  );
}

// ─── AGENDA ──────────────────────────────────────────────────────────────────
function bloqueHorario(hora) {
  if (!hora) return 'Día';
  const h = parseInt(String(hora).split(':')[0]) || 0;
  if (h < 13) return 'Mañana';
  if (h < 19) return 'Tarde';
  return 'Noche';
}

function renderAgenda() {
  const el = document.getElementById('agenda-list');
  const badge = document.getElementById('badge-ag');
  const ahora = new Date();
  const partidos = D.partidos.filter(p => p.Estado === 'Programado')
    .sort((a,b) => {
      const ja = parseInt(a.Partidos) || 9999;
      const jb = parseInt(b.Partidos) || 9999;
      if (ja !== jb) return ja - jb;
      const fa = new Date(cleanFecha(a.Fecha)+'T12:00:00');
      const fb = new Date(cleanFecha(b.Fecha)+'T12:00:00');
      if (fa - fb !== 0) return fa - fb;
      return (a.Hora||'').localeCompare(b.Hora||'');
    });
  badge.textContent = partidos.length + ' partidos';
  if (!partidos.length) { el.innerHTML = empty('📅','Sin partidos programados'); return; }

  // Encontrar el partido más próximo
  let proximoIdx = 0;
  let menorDif = Infinity;
  partidos.forEach((p, i) => {
    const f = cleanFecha(p.Fecha);
    const h = fmtTime(p.Hora).replace(' hrs','') || '00:00';
    const dt = new Date(f + 'T' + h + ':00');
    const dif = dt - ahora;
    if (dif >= 0 && dif < menorDif) { menorDif = dif; proximoIdx = i; }
  });

  // Agrupar por fecha + bloque horario
  const grupos = {};
  partidos.forEach(p => {
    const f = cleanFecha(p.Fecha);
    const bloque = bloqueHorario(p.Hora);
    const key = f + '||' + bloque;
    if (!grupos[key]) grupos[key] = { fecha: f, bloque, partidos: [] };
    grupos[key].partidos.push(p);
  });

  // Ordenar grupos por fecha luego bloque
  const bloqueOrd = { 'Mañana':0, 'Tarde':1, 'Noche':2, 'Día':3 };
  const gruposOrdenados = Object.values(grupos).sort((a,b) => {
    const fa = new Date(a.fecha+'T12:00:00');
    const fb = new Date(b.fecha+'T12:00:00');
    if (fa-fb !== 0) return fa-fb;
    return (bloqueOrd[a.bloque]||0) - (bloqueOrd[b.bloque]||0);

  let html = '';

    html += `<div class="day-block">
      <div class="day-block-header">
        <div class="day-block-title">${tituloBloque}</div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:11px;opacity:.75">${fechaLarga}</span>
          <span class="day-block-count">${grupo.partidos.length} partido${grupo.partidos.length>1?'s':''}</span>
        </div>
      </div>`;

    grupo.partidos.forEach(p => {
      const liga = ligaObj(p.ID_Liga);
      const cat = liga ? liga.Categoria : '';
      const isProximo = partidos.indexOf(p) === proximoIdx;
      const hora = fmtTime(p.Hora);
      const horaNum = hora.replace(' hrs','');

      const catLabel = cat || (liga ? liga.Categoria : '') || '';
      html += `<div class="sched-card${isProximo?' proximo':''}">
        <div class="sched-top">
          <span class="sched-num${isProximo?' proximo-badge':''}">${isProximo?'<span class="proximo-dot"></span>':''}Partido ${p.Partidos||''}</span>
          ${p.Fase && p.Fase!=='Regular' ? `<span style="font-size:10px;font-weight:700;color:var(--orange);background:var(--orange-light);padding:2px 8px;border-radius:100px">${p.Fase}</span>` : ''}
        </div>
        <div class="sched-teams">
          <div class="sched-team-name">${teamName(p.ID_EquipoLocal)}</div>
          <div style="text-align:center;flex-shrink:0">
            <div class="sched-hora">${horaNum}</div>
            <div class="sched-hora-sub">hrs</div>
            <div style="font-size:10px;font-weight:700;color:var(--primary);margin-top:4px;line-height:1.2;max-width:110px">${liga?liga.NombreFantasia:''}</div>
          </div>
          <div class="sched-team-name right">${teamName(p.ID_EquipoVisita)}</div>
        </div>
        <div class="sched-bottom">
          <span class="sched-lugar">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0112 2a8 8 0 018 8.2c0 7.3-8 11.8-8 11.8z"/></svg>
            ${p.Cancha||'Por confirmar'}

          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
            ${p.YoutubeURL ? `<a class="yt-link" href="${p.YoutubeURL}" target="_blank" style="font-size:11px;font-weight:700;color:var(--red);text-decoration:none">📺 Ver</a>` : ''}
            <button class="sched-share-btn" onclick="sharePartido('${p.ID}')">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.126.554 4.122 1.521 5.855L.057 23.882l6.174-1.438A11.945 11.945 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 01-5.006-1.372l-.36-.213-3.664.854.883-3.564-.233-.374A9.793 9.793 0 012.182 12C2.182 6.57 6.57 2.182 12 2.182c5.43 0 9.818 4.388 9.818 9.818 0 5.43-4.388 9.818-9.818 9.818z"/></svg>
              WhatsApp
            </button>
          </div>

// ─── RESULTADOS ──────────────────────────────────────────────────────────────
function renderResultados() {
  const el = document.getElementById('resultados-list');
  const badge = document.getElementById('badge-res');
  const cuartosE = ['1° Cuarto','2° Cuarto','3° Cuarto','4° Cuarto'];
  const partidos = D.partidos
    .filter(p => p.Estado === 'Finalizado' || cuartosE.indexOf(p.Estado) >= 0)
    .sort((a,b) => new Date(cleanFecha(b.Fecha)+'T12:00:00') - new Date(cleanFecha(a.Fecha)+'T12:00:00'));
  badge.textContent = partidos.length + ' partidos';
  if (!partidos.length) { el.innerHTML = empty('🏀','Sin resultados disponibles'); return; }
  let html = '';
  const enCuarto = partidos.filter(p => cuartosE.indexOf(p.Estado) >= 0);
  const finalizados = partidos.filter(p => p.Estado === 'Finalizado');
  if (enCuarto.length) {
    html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><div style="width:8px;height:8px;border-radius:50%;background:var(--orange);animation:pulse 1.2s infinite;flex-shrink:0"></div><span style="font-size:11px;font-weight:700;color:var(--orange);letter-spacing:1.2px;text-transform:uppercase">En curso</span></div>`;
    enCuarto.forEach(p => { html += buildMatchCard(p); });
  }
  if (finalizados.length) {
    if (enCuarto.length) html += '<div class="results-divider">Finalizados</div>';
    finalizados.forEach(p => { html += buildMatchCard(p); });
  }
  if (!enCuarto.length && !finalizados.length) html = empty('🏀','Sin resultados disponibles');
  el.innerHTML = html;
  attachChevrons();
}

function buildMatchCard(p) {
  const cuartos = ['1° Cuarto','2° Cuarto','3° Cuarto','4° Cuarto'];
  const isCuarto = cuartos.indexOf(p.Estado) >= 0;
  const isFinal = p.Estado === 'Finalizado';
  const gl = parseInt(p.GolesLocal !== undefined && p.GolesLocal !== '' ? p.GolesLocal : p.PuntosLocal) || 0;
  const gv = parseInt(p.GolesVisita !== undefined && p.GolesVisita !== '' ? p.GolesVisita : p.PuntosVisita) || 0;
  const lWin = isFinal && gl > gv;
  const vWin = isFinal && gv > gl;
  const liga = ligaObj(p.ID_Liga);
  const statusCls = isCuarto ? 'status-cuarto' : (isFinal ? 'status-final' : 'status-prog');
  const statusTxt = isCuarto ? '<span class="live-dot"></span>'+p.Estado : (isFinal ? 'Final' : 'Programado');
  const cardCls = isCuarto ? 'live' : (isFinal ? 'final' : 'prog');
  const scoreBlock = p.Estado === 'Programado'

function fmtFechaNoticia(raw) {
  if (!raw) return '';
  const clean = cleanFecha(raw);
  if (!clean) return '';
  const d = new Date(clean + 'T12:00:00');
  if (isNaN(d)) return '';
  return d.toLocaleDateString('es-CL', { day:'numeric', month:'long', year:'numeric' });
}

// ─── ADMIN ───────────────────────────────────────────────────────────────────
function setupAdmin() {
  const overlay = document.getElementById('admin-overlay');
  document.getElementById('admin-btn').addEventListener('click', () => overlay.classList.add('open'));
  document.getElementById('panel-close-btn').addEventListener('click', closeAdmin);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeAdmin(); });
  document.getElementById('do-login').addEventListener('click', doLogin);
  document.getElementById('admin-pass').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
  document.getElementById('btn-logout').addEventListener('click', doLogout);
  document.querySelectorAll('.adm-tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.adm-tab').forEach(b => b.classList.remove('active'));
      t.classList.add('active');
      document.querySelectorAll('.adm-panel').forEach(p => p.classList.remove('active'));
      document.getElementById(t.dataset.tab).classList.add('active');
      activeAdmTab = t.dataset.tab;
      if (t.dataset.tab === 'tab-res-adm') renderResAdm();
      if (t.dataset.tab === 'tab-partidos') renderPartidosAdm();
    });
  });
  document.getElementById('pt-liga').addEventListener('change', function() { populateEqForLiga(this.value, 'pt-local', 'pt-visita'); });
  document.getElementById('sa-liga').addEventListener('change', function() { populateEqForLiga(this.value, 'sa-equipo'); });
  document.getElementById('eq-liga').addEventListener('change', function() { renderEquiposAdm(); });
  document.getElementById('btn-liga').addEventListener('click', createLiga);
  document.getElementById('btn-equipo').addEventListener('click', createEquipo);
  document.getElementById('btn-partido').addEventListener('click', createPartido);
  document.getElementById('btn-noticia').addEventListener('click', createNoticia);
  document.getElementById('btn-sancion').addEventListener('click', createSancion);
  document.getElementById('modal-cancel').addEventListener('click', () => document.getElementById('modal-overlay').classList.remove('open'));
  document.getElementById('modal-save').addEventListener('click', () => { if (modalSaveCb) modalSaveCb(); });
}

function closeAdmin() { document.getElementById('admin-overlay').classList.remove('open'); }

async function doLogin() {
  const p = document.getElementById('admin-pass').value;
  if (!p) return;
  try {
    const res  = await fetch(NETLIFY_FN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'checkPassword', adminPassword: p }),
    });
    const json = JSON.parse(await res.text());
    if (json && json.success) {
      adminPass = p;
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('admin-content').style.display = 'block';
      populateAdminSelects();
      renderAdmin();
    } else {
      document.getElementById('login-error').style.display = 'block';
      setTimeout(() => document.getElementById('login-error').style.display = 'none', 2500);
    }
  } catch(e) { toast('Error de conexión: ' + e.message, 'err'); }
}

function doLogout() {
  adminPass = '';
  document.getElementById('login-form').style.display = 'block';
  document.getElementById('admin-content').style.display = 'none';
  document.getElementById('admin-pass').value = '';
  closeAdmin();
}

function populateAdminSelects() {
  const ligaOpts = D.ligas.map(l => `<option value="${l.ID}">${l.NombreFantasia} (${l.Categoria})</option>`).join('');
  ['eq-liga','pt-liga','sa-liga'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = '<option value="">— Seleccionar liga —</option>' + ligaOpts;
  });
  const eqOpts = D.equipos.map(e => `<option value="${e.ID}">${e.NombreEquipo}</option>`).join('');
  ['pt-local','pt-visita','sa-equipo'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = '<option value="">— Seleccionar equipo —</option>' + eqOpts;
  });
}

function populateEqForLiga(ligaId, sel1, sel2) {
  const opts = '<option value="">— Seleccionar equipo —</option>'
    + D.equipos.filter(e => !ligaId || e.ID_Liga === ligaId)
      .map(e => `<option value="${e.ID}">${e.NombreEquipo}</option>`).join('');
  [sel1, sel2].forEach(id => { if(id){ const el=document.getElementById(id); if(el) el.innerHTML=opts; }});
}

            <option value="4° Cuarto"${p.Estado==='4° Cuarto'?' selected':''}>4° Cuarto</option>

        <div class="result-label" style="text-align:center;margin-bottom:8px">

// ─── CRUD — llaman a Apps Script solo para escribir ──────────────────────────
async function gasCall(action, data) {
  try {
    const res = await callGAS(action, data);
    if (res && res.success) {
      await refreshData();
      renderAll();
      if (adminPass) renderAdmin();
      toast(res.message || 'Guardado ✓', 'ok');
    } else {
      toast((res && res.message) || 'Error', 'err');
    }
  } catch(e) { toast(e.message, 'err'); }
}

function createLiga() {
  const nombre = document.getElementById('lg-nombre').value.trim();
  if (!nombre) { toast('Ingresa el nombre de la liga','err'); return; }
  gasCall('createLeague', { nombreDeporte:'Básquetbol', categoria:document.getElementById('lg-cat').value, nombreFantasia:nombre, estadoTorneo:document.getElementById('lg-estado').value });
  document.getElementById('lg-nombre').value = '';
}

function createEquipo() {
  const nombre = document.getElementById('eq-nombre').value.trim();
  const liga = document.getElementById('eq-liga').value;
  if (!nombre || !liga) { toast('Completá nombre y liga','err'); return; }
  gasCall('createTeam', { idLiga:liga, nombreEquipo:nombre, colorLocal:document.getElementById('eq-cl').value.trim(), colorVisita:document.getElementById('eq-cv').value.trim() });
  ['eq-nombre','eq-cl','eq-cv'].forEach(id => document.getElementById(id).value = '');
  // Lista se refresca automáticamente via renderAdmin() en gasCall
}

function createPartido() {
  const local = document.getElementById('pt-local').value;
  const visita = document.getElementById('pt-visita').value;
  const fecha = document.getElementById('pt-fecha').value;
  const hora = document.getElementById('pt-hora').value;
  if (!local || !visita) { toast('Seleccioná los equipos','err'); return; }
  if (local === visita) { toast('Los equipos no pueden ser iguales','err'); return; }
  if (!fecha || !hora) { toast('Completá fecha y hora','err'); return; }
  gasCall('createMatch', { idLiga:document.getElementById('pt-liga').value, jornada:document.getElementById('pt-jornada').value, fase:document.getElementById('pt-fase').value, fecha, hora, cancha:document.getElementById('pt-cancha').value.trim(), idLocal:local, idVisita:visita, youtubeUrl:document.getElementById('pt-yt').value.trim() });
  ['pt-jornada','pt-fecha','pt-hora','pt-cancha','pt-yt'].forEach(id => document.getElementById(id).value = '');
}

function createNoticia() {
  const titulo = document.getElementById('nt-titulo').value.trim();
  if (!titulo) { toast('Ingresa el título','err'); return; }
  gasCall('createNews', { titulo, descripcion:document.getElementById('nt-desc').value.trim(), imagenUrl:document.getElementById('nt-img').value.trim(), enlace:document.getElementById('nt-link').value.trim() });
  ['nt-titulo','nt-desc','nt-img','nt-link'].forEach(id => document.getElementById(id).value = '');
}

function createSancion() {
  const jugador = document.getElementById('sa-jugador').value.trim();
  const sancion = document.getElementById('sa-sancion').value.trim();
  if (!jugador || !sancion) { toast('Completa jugador y sanción','err'); return; }
  const apelacion = document.getElementById('sa-apelacion') ? document.getElementById('sa-apelacion').value.trim() : '';
  const terminoFull = document.getElementById('sa-termino').value.trim() + (apelacion ? ' | Apelación: ' + apelacion : '');
  gasCall('createSanction', { idLiga:document.getElementById('sa-liga').value, idEquipo:document.getElementById('sa-equipo').value, nombreJugador:jugador, tipoFalta:document.getElementById('sa-tipo').value, sancion, termino:terminoFull });
  ['sa-jugador','sa-sancion','sa-termino','sa-apelacion'].forEach(id => { const el = document.getElementById(id); if(el) el.value = ''; });
}

window.saveResult = id => gasCall('updateMatchResult', { matchId:id, golesLocal:document.getElementById('gl-'+id).value, golesVisita:document.getElementById('gv-'+id).value, estado:document.getElementById('st-'+id).value });
window.delItem = (id, sheet) => showConfirm('¿Eliminar permanentemente?', () => gasCall('deleteItem', { id, sheet }));
window.delPartido = id => showConfirm('¿Eliminar este partido?', () => gasCall('deleteMatch', { matchId:id }));
window.delLiga = id => showConfirm('¿Eliminar la liga y todos sus datos? Esta acción es irreversible.', () => gasCall('deleteLeague', { leagueId:id }));

window.openEditLiga = function(id) {
  const l = D.ligas.find(x => x.ID === id);
  if (!l) return;
  document.getElementById('modal-title').textContent = 'Editar Liga';
  document.getElementById('modal-body').innerHTML = `
    <label class="f-label">Categoría</label>
    <select class="f-select" id="m-cat"><option>Varones</option><option>Damas</option><option>Mixto</option></select>
    <label class="f-label">Nombre</label>
    <input class="f-input" id="m-nombre" type="text" value="${l.NombreFantasia}">
    <label class="f-label">Estado</label>
    <select class="f-select" id="m-estado"><option value="Activo">Activo</option><option value="Finalizado">Finalizado</option></select>`;
  document.getElementById('m-cat').value = l.Categoria;
  document.getElementById('m-estado').value = l.EstadoTorneo || 'Activo';
  document.getElementById('modal-overlay').classList.add('open');
  modalSaveCb = () => {
    gasCall('updateLeague', { leagueId:id, nombreDeporte:'Básquetbol', categoria:document.getElementById('m-cat').value, nombreFantasia:document.getElementById('m-nombre').value.trim(), estadoTorneo:document.getElementById('m-estado').value });
    document.getElementById('modal-overlay').classList.remove('open');
  };
};

window.openEditSancion = function(id) {
  const s = D.sanciones.find(x => x.ID === id);
  if (!s) return;
  const ligaOpts = D.ligas.map(l => `<option value="${l.ID}"${l.ID===s.ID_Liga?' selected':''}>${l.NombreFantasia}</option>`).join('');
  const eqOpts = D.equipos.map(e => `<option value="${e.ID}"${e.ID===s.ID_Equipo?' selected':''}>${e.NombreEquipo}</option>`).join('');
  document.getElementById('modal-title').textContent = 'Editar Sanción';
  document.getElementById('modal-body').innerHTML = `
    <label class="f-label">Liga</label><select class="f-select" id="ms-liga">${ligaOpts}</select>
    <label class="f-label">Equipo</label><select class="f-select" id="ms-equipo">${eqOpts}</select>

    <label class="f-label">Tipo de falta</label>
    <select class="f-select" id="ms-tipo"><option>Falta Técnica</option><option>Falta Antideportiva</option><option>Expulsión</option><option>Agresión</option><option>Otros</option></select>
    <label class="f-label">Sanción</label><textarea class="f-input" id="ms-sancion" rows="2">${s.Sancion}</textarea>
    <label class="f-label">Término</label><input class="f-input" id="ms-termino" type="text" value="${s.TerminoSancion||''}">`;
  document.getElementById('ms-tipo').value = s.TipoFalta;
  document.getElementById('modal-overlay').classList.add('open');
  modalSaveCb = () => {
    gasCall('updateSanction', { sanctionId:id, idLiga:document.getElementById('ms-liga').value, idEquipo:document.getElementById('ms-equipo').value, nombreJugador:document.getElementById('ms-jugador').value.trim(), tipoFalta:document.getElementById('ms-tipo').value, sancion:document.getElementById('ms-sancion').value.trim(), termino:document.getElementById('ms-termino').value.trim() });

window.enterApp = function() {
  const splash = document.getElementById('splash-screen');
  splash.style.transition = 'opacity .5s';
  splash.style.opacity = '0';

// ─── ADMIN PARTIDOS LIST ──────────────────────────────────────────────────────
function renderPartidosAdm() {
  const el = document.getElementById('partidos-adm-list');
  if (!el) return;
  const partidos = [...D.partidos].sort((a,b) => {
    const ja = parseInt(a.Partidos) || 9999;
    const jb = parseInt(b.Partidos) || 9999;
    return ja - jb;
  });
  if (!partidos.length) { el.innerHTML = '<div style="font-size:13px;color:var(--muted);padding:8px 0">No hay partidos registrados.</div>'; return; }
  el.innerHTML = partidos.map(p => {
    const liga = ligaObj(p.ID_Liga);
    return `<div class="adm-list-item">
      <div>
        <div class="adm-list-name">${teamName(p.ID_EquipoLocal)} vs ${teamName(p.ID_EquipoVisita)}</div>
        <div class="adm-list-sub">${fmtDate(p.Fecha)}${fmtTime(p.Hora)?' · '+fmtTime(p.Hora):''} · ${liga?liga.NombreFantasia:''}</div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="edit-btn" onclick="openEditPartido('${p.ID}')">Editar</button>
        <button class="del-btn" onclick="delPartido('${p.ID}')">Eliminar</button>
      </div>
    </div>`;
  }).join('');
}

// ─── COMPARTIR PARTIDO ───────────────────────────────────────────────────────
window.sharePartido = function(partidoId) {
  const p = D.partidos.find(x => x.ID === partidoId);
  if (!p) return;
  const liga = ligaObj(p.ID_Liga);
  const cat = liga ? liga.Categoria : '';
  const local = teamName(p.ID_EquipoLocal);
  const visita = teamName(p.ID_EquipoVisita);
  const fecha = cleanFecha(p.Fecha);
  const d = new Date(fecha + 'T12:00:00');
  const diaSemana = isNaN(d) ? '' : d.toLocaleDateString('es-CL',{weekday:'long'});
  const diaCap = diaSemana.charAt(0).toUpperCase() + diaSemana.slice(1);
  const fechaLarga = isNaN(d) ? '' : d.toLocaleDateString('es-CL',{day:'numeric',month:'long',year:'numeric'});
  const hora = fmtTime(p.Hora);
  const cancha = p.Cancha || 'Por confirmar';

  var sep = '%E2%94%80%E2%94%80%E2%94%80%E2%94%80%E2%94%80%E2%94%80%E2%94%80%E2%94%80%E2%94%80%E2%94%80%E2%94%80%E2%94%80%E2%94%80%E2%94%80%E2%94%80%E2%94%80%E2%94%80%E2%94%80%E2%94%80';
  var texto = encodeURIComponent('*ARBA COMPETENCIAS*') + '%0A' + sep + '%0A'
    + encodeURIComponent('*' + local + ' vs ' + visita + '*') + '%0A' + sep + '%0A'
    + encodeURIComponent(diaCap + ' ' + fechaLarga) + '%0A'
    + encodeURIComponent(hora) + '%0A'
    + encodeURIComponent(cancha) + '%0A'
    + encodeURIComponent((liga ? liga.NombreFantasia : '') + ' - ' + cat) + '%0A' + sep + '%0A'
    + encodeURIComponent('Ver programacion completa: https://arba-arica.netlify.app');

  window.location.href = 'https://wa.me/?text=' + texto;
};

function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type||'');
  setTimeout(() => el.className = 'toast', 2800);
}
</script>
